# Weekly pull requests for outdated dependencies. Python packages, GitHub Actions and container
# images each come grouped in one pull request; a new Django feature release comes on its own,
# to upgrade by hand (pyproject.toml pins `<6.2`).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        exclude-patterns: ["django"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The Dockerfile's base images (python, uv).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
  # Postgres, Redis and cloudflared in the compose files.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose:
        patterns: ["*"]
